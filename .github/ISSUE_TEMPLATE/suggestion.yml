name: Suggestion / balance feedback
description: Ideas, balance, feel, new characters.
labels: ["suggestion"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: About
      options:
        - NarutoSageMod (Sage Naruto)
        - SasukeMangekyouMod (Taka Sasuke)
        - MinatoMod
        - KizunaMod (co-op bonds / combos)
        - A new character
        - Something else
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you change and why? For balance, say the difficulty and roughly which stage/loop.
    validations:
      required: true
